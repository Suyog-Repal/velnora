name: Velnora Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
      - 'release-*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Velnora Release APK
    runs-on: ubuntu-24.04
    env:
      CI: true
      # Backend address baked into the app at build time (Expo inlines EXPO_PUBLIC_* into the JS bundle).
      # Set the repository VARIABLE EXPO_PUBLIC_API_URL (Settings > Secrets and variables > Actions > Variables) to change it.
      # It is public by design (it ships inside the APK), so it is a variable, NOT a secret. Never put DATABASE_URL or
      # JWT_SECRET_KEY here: those belong only to the Render service.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://velnora-backend-pq17.onrender.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate mobile API URL
        shell: bash
        run: |
          url="$EXPO_PUBLIC_API_URL"
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::EXPO_PUBLIC_API_URL must be an https:// origin with no path and no trailing slash (got: '$url')"
            exit 1
          fi
          if [[ "$url" == *neon.tech* || "$url" == *postgres* ]]; then
            echo "::error::EXPO_PUBLIC_API_URL looks like a database address. It must be the Render backend URL."
            exit 1
          fi
          echo "Mobile API origin for this build: $url"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency compatibility
        run: |
          npm ls expo react react-native lucide-react-native
          # expo-doctor exit code 1 means "packages out of date" – that is a warning,
          # not a build-breaker. We print the output so it is visible in the log but we
          # do NOT let it abort the workflow. Real hard errors (missing plugins, SDK
          # incompatibilities, etc.) surface during prebuild / Gradle instead.
          npx expo-doctor || echo "::warning::expo-doctor reported outdated packages – see output above. Update package.json to clear this warning."

      - name: Typecheck
        run: npm run typecheck

      - name: Test transaction parser
        run: npm test

      - name: Inspect Expo prebuild configuration
        run: npx expo config --type prebuild

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Verify SMS module autolinking
        shell: bash
        run: |
          autolinking_json="$(mktemp)"
          autolinking_stderr="$(mktemp)"
          trap 'rm -f "$autolinking_json" "$autolinking_stderr"' EXIT
          if ! npx expo-modules-autolinking resolve --platform android --json \
            >"$autolinking_json" 2>"$autolinking_stderr"; then
            cat "$autolinking_stderr" >&2
            echo "::error::Expo Android autolinking failed"
            exit 1
          fi
          AUTOLINKING_JSON="$autolinking_json" node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const result = JSON.parse(fs.readFileSync(process.env.AUTOLINKING_JSON, 'utf8'));
          const smsModule = (result.modules || []).find(
            (entry) => entry.packageName === '@velnora/sms',
          );
          if (!smsModule) {
            throw new Error('Velnora SMS module is missing from Expo Android autolinking');
          }

          const project = (smsModule.projects || []).find((entry) =>
            (entry.modules || []).some(
              (module) => module.classifier === 'com.velnora.sms.VelnoraSmsModule',
            ),
          );
          if (!project) {
            throw new Error(
              'Velnora SMS Android project or module classifier is missing from Expo autolinking',
            );
          }

          const source = path.join(
            project.sourceDir,
            'src',
            'main',
            'java',
            'com',
            'velnora',
            'sms',
            'VelnoraSmsModule.kt',
          );
          if (!fs.existsSync(source)) {
            throw new Error(`Velnora SMS Kotlin source is missing: ${source}`);
          }
          console.log(`Autolinked ${smsModule.packageName} from ${project.sourceDir}`);
          console.log('Android classifier: com.velnora.sms.VelnoraSmsModule');
          console.log(`Kotlin source present: ${source}`);
          NODE
          echo "Expo Android autolinking validation passed"
          grep -q 'expoAutolinking.useExpoModules' android/settings.gradle
          grep -q 'autolinkLibrariesWithApp' android/app/build.gradle

      - name: Verify generated Android project
        working-directory: android
        shell: bash
        run: |
          test -s settings.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          manifest="app/src/main/AndroidManifest.xml"
          grep -Fq 'com.velnora.sms.VelnoraSmsReceiver' "$manifest"
          grep -Fq 'android.permission.RECEIVE_SMS' "$manifest"
          grep -Fq 'android.permission.BROADCAST_SMS' "$manifest"
          chmod +x gradlew
          projects="$(./gradlew --no-daemon projects --console plain)"
          printf '%s\n' "$projects"
          if ! grep -Eiq 'velnora.sms|velnora-sms' <<<"$projects"; then
            echo "::error::The Velnora SMS Android Gradle project is missing from autolinking"
            exit 1
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pandroid.enableMinifyInReleaseBuilds=false --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$apk_path" ]]; then
            echo "::error::Expected APK is missing or empty: $apk_path"
            exit 1
          fi
          stat --printf='APK: %n (%s bytes)\n' "$apk_path"

      - name: Verify the API URL is embedded in the APK
        shell: bash
        run: |
          # An APK built without the URL cannot sign in or register ("Unable to reach Velnora"). Fail the build instead of shipping it.
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          host="${EXPO_PUBLIC_API_URL#https://}"
          bundle="$RUNNER_TEMP/index.android.bundle"
          unzip -p "$apk_path" assets/index.android.bundle > "$bundle"
          if ! grep -a -F -q "$host" "$bundle"; then
            echo "::error::The APK was built without the API host ($host). Registration and sign-in would fail on devices."
            exit 1
          fi
          echo "API host $host is embedded in the APK."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Velnora-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          apk_source="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk_source" ]]; then
            apk_source="$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)"
          fi

          if [[ ! -f "$apk_source" ]]; then
            echo "::error::Source APK not found"
            exit 1
          fi

          apk_release="velnora-${tag}.apk"
          echo "Preparing release asset: $apk_release from $apk_source"
          cp "$apk_source" "$apk_release"
          sha256sum "$apk_release" > "${apk_release}.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Updating release assets..."
            gh release upload "$tag" "$apk_release" "${apk_release}.sha256" --clobber
          else
            echo "Creating GitHub Release $tag..."
            gh release create "$tag" "$apk_release" "${apk_release}.sha256" \
              --title "Release $tag" \
              --generate-notes
          fi
