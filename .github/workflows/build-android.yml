name: Velnora Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Velnora Debug APK
    runs-on: ubuntu-24.04
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency compatibility
        run: |
          npm ls expo react react-native lucide-react-native
          npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Test transaction parser
        run: npm test

      - name: Inspect Expo prebuild configuration
        run: npx expo config --type prebuild

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Verify SMS module autolinking
        shell: bash
        run: |
          npx expo-modules-autolinking resolve --platform android > /tmp/velnora-autolinking.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const result = JSON.parse(fs.readFileSync('/tmp/velnora-autolinking.json', 'utf8'));
          const module = (result.modules || []).find((entry) =>
            entry.packageName === '@velnora/sms' || entry.modules?.includes('VelnoraSmsModule'),
          );
          if (!module) {
            throw new Error('Velnora SMS module is missing from Expo Android autolinking');
          }
          const source = path.join(module.path, 'android', 'src', 'main', 'java', 'com', 'velnora', 'sms', 'VelnoraSmsModule.kt');
          if (!fs.existsSync(source)) {
            throw new Error(`Autolinking resolved an unexpected SMS module path: ${source}`);
          }
          console.log(`Autolinked ${module.packageName} from ${module.path}`);
          console.log(`Kotlin source present: ${source}`);
          NODE
          grep -q 'expoAutolinking.useExpoModules' android/settings.gradle
          grep -q 'autolinkLibrariesWithApp' android/app/build.gradle

      - name: Verify generated Android project
        working-directory: android
        shell: bash
        run: |
          test -s settings.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          manifest="app/src/main/AndroidManifest.xml"
          grep -Fq 'com.velnora.sms.VelnoraSmsReceiver' "$manifest"
          grep -Fq 'android.permission.RECEIVE_SMS' "$manifest"
          grep -Fq 'android.permission.BROADCAST_SMS' "$manifest"
          chmod +x gradlew
          projects="$(./gradlew --no-daemon projects --console plain)"
          printf '%s\n' "$projects"
          if ! grep -Eiq 'velnora.sms|velnora-sms' <<<"$projects"; then
            echo "::error::The Velnora SMS Android Gradle project is missing from autolinking"
            exit 1
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$apk_path" ]]; then
            echo "::error::Expected APK is missing or empty: $apk_path"
            exit 1
          fi
          stat --printf='APK: %n (%s bytes)\n' "$apk_path"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Velnora-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
